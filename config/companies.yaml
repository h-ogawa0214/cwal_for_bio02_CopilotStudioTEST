companies:
  - name: PR TIMES（医薬・創薬・バイオ）
    # PR TIMES はカテゴリ別RSSが無いため、キーワードタグ一覧ページを巡回する。
    # 1行で複数社の未上場バイオ／研究団体のPRを拾い、TDnet非掲載分を補完する。
    list_url: https://prtimes.jp/topics/keywords/創薬
    enabled: true
    source_type: prtimes
    stock_code: ""
    crawl_mode: shadow
    config:
      keywords:
        - 創薬
        - バイオテクノロジー
        - 医薬品
        - 動物用医薬品
        - フードテック
      max_per_keyword: 10
    notes: "keyword-tag aggregator; shadow until incremental yield confirmed"

  - name: アステラス製薬
    list_url: https://jp.newsroom.astellas.com/news
    enabled: true
    source_type: html_css
    stock_code: "4503"
    config:
      item_selector: li.wd_item
      title_selector: div.wd_title a
      date_selector: div.wd_date
      link_selector: div.wd_title a
      summary_selector: div.wd_summary

  - name: 大塚ホールディングス
    list_url: https://www.otsuka.com/jp/ir/news/
    enabled: true
    source_type: playwright
    stock_code: "4578"
    config:
      wait_selector: ".eir a, .eir_list a, a[href*='pdf'], a[href*='news']"
      link_selector: .eir a
      min_title_length: 12
      same_host_only: false

  - name: 中外製薬
    list_url: https://www.chugai-pharm.co.jp/news/
    enabled: true
    source_type: html_css
    stock_code: "4519"
    config:
      item_selector: li.ist-list01__item
      title_selector: a.ist-list01__titleText
      date_selector: time.ist-list01__date
      link_selector: a.ist-list01__titleText

  - name: 協和キリン
    list_url: https://www.kyowakirin.co.jp/pressroom/news_releases/index.html
    enabled: true
    source_type: playwright
    stock_code: "4151"
    config:
      wait_selector: "a[href*='/pressroom/news_releases/'][href$='.pdf']"
      link_selector: "a[href*='/pressroom/news_releases/'][href$='.pdf']"
      min_title_length: 12
      same_host_only: true

  - name: 住友ファーマ
    list_url: https://www.sumitomo-pharma.co.jp/news/ir/
    enabled: true
    source_type: rss
    stock_code: "4506"
    config:
      feed_url: "https://www.sumitomo-pharma.co.jp/news/rss/index.xml"

  - name: 明治製菓ファルマ
    # GitHub Actions IP から xlsx が 403 のため当面スキップ
    # 非単独上場のため TDnet 証券コードなし（親会社は明治HD 2269）
    list_url: https://www.meiji-seika-pharma.co.jp/pressrelease/
    enabled: false
    source_type: xlsx
    stock_code: ""
    config:
      xlsx_url: "https://www.meiji-seika-pharma.co.jp/pressrelease/xlsx/pressrelease.xlsx"
      title_column: title
      date_column: date
      url_column: url
    notes: "Actions IP blocked (403). Re-enable when alternate source or proxy is ready."

